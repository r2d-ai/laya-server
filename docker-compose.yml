services:
  laya-server:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"

    runtime: nvidia

    environment:
      LAYA_DEVICE: cuda
      LAYA_STRICT_CUDA: "true"
      LAYA_MAX_CONCURRENCY: "2"

      TRITON_CACHE_DIR: /cache/triton

      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"

      # HF_TOKEN: ${HF_TOKEN:-}
      # LAYA_API_KEY: ${LAYA_API_KEY:-}

    volumes:
      - laya-hf-cache:/cache/huggingface
      - laya-triton-cache:/cache/triton

volumes:
  laya-hf-cache:
  laya-triton-cache:
